<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SchoolHub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
    
    <style>
        .auth-container {
            min-height: 100vh;
            padding: 2rem 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }
        
        .auth-card {
            background: var(--bg-primary);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .auth-brand {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        
        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .step::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: var(--border-color);
            z-index: -1;
        }
        
        .step:first-child::before {
            left: 50%;
            width: 50%;
        }
        
        .step:last-child::before {
            right: 50%;
            width: 50%;
        }
        
        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--border-color);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .step.active .step-number {
            background: var(--primary-color);
            color: white;
        }
        
        .step.completed .step-number {
            background: var(--success-color);
            color: white;
        }
        
        .step-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .form-step {
            display: none;
        }
        
        .form-step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="auth-card">
                        <div class="p-5">
                            <div class="mb-4 text-center">
                                <a href="../index.html" class="text-decoration-none">
                                    <h1 class="auth-brand text-gradient">
                                        <i class="fas fa-graduation-cap"></i> SchoolHub
                                    </h1>
                                </a>
                                <h2 class="h4 mb-2">Create Your Account</h2>
                                <p class="text-muted">Get started with SchoolHub today</p>
                            </div>
                            
                            <!-- Step Indicator -->
                            <div class="step-indicator">
                                <div class="step active" id="step1-indicator">
                                    <div class="step-number">1</div>
                                    <div class="step-title">Account Info</div>
                                </div>
                                <div class="step" id="step2-indicator">
                                    <div class="step-number">2</div>
                                    <div class="step-title">School Details</div>
                                </div>
                                <div class="step" id="step3-indicator">
                                    <div class="step-number">3</div>
                                    <div class="step-title">Complete</div>
                                </div>
                            </div>
                            
                            <!-- Signup Form -->
                            <form id="signupForm" class="needs-validation" novalidate>
                                <!-- Step 1: Account Information -->
                                <div class="form-step active" id="step1">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                                                <label for="firstName">First Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                                                <label for="lastName">Last Name</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                                <label for="email">Email Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" id="password" placeholder="Password" required minlength="8">
                                                <label for="password">Password</label>
                                                <small class="text-muted">Minimum 8 characters</small>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                                                <label for="confirmPassword">Confirm Password</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between mt-4">
                                        <a href="login.html" class="btn btn-outline-secondary">Back to Login</a>
                                        <button type="button" class="btn btn-primary" onclick="nextStep(2)">
                                            Next <i class="fas fa-arrow-right ms-2"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- Step 2: School Details -->
                                <div class="form-step" id="step2">
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="schoolName" placeholder="School Name" required>
                                                <label for="schoolName">School Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <select class="form-select" id="schoolType" required>
                                                    <option value="">Select Type</option>
                                                    <option value="elementary">Elementary School</option>
                                                    <option value="middle">Middle School</option>
                                                    <option value="high">High School</option>
                                                    <option value="college">College/University</option>
                                                    <option value="other">Other</option>
                                                </select>
                                                <label for="schoolType">School Type</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="number" class="form-control" id="studentCount" placeholder="Number of Students" required>
                                                <label for="studentCount">Number of Students</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="address" placeholder="Address" required>
                                                <label for="address">Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="city" placeholder="City" required>
                                                <label for="city">City</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="country" placeholder="Country" required>
                                                <label for="country">Country</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required>
                                                <label for="phone">Phone Number</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between mt-4">
                                        <button type="button" class="btn btn-outline-secondary" onclick="previousStep(1)">
                                            <i class="fas fa-arrow-left me-2"></i> Previous
                                        </button>
                                        <button type="button" class="btn btn-primary" onclick="nextStep(3)">
                                            Next <i class="fas fa-arrow-right ms-2"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- Step 3: Complete -->
                                <div class="form-step" id="step3">
                                    <div class="text-center mb-4">
                                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                                        <h3 class="mt-3">Almost Done!</h3>
                                        <p class="text-muted">Review your information and complete registration</p>
                                    </div>
                                    
                                    <div class="card-custom mb-4">
                                        <h5 class="mb-3">Account Summary</h5>
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <small class="text-muted">Name</small>
                                                <p class="mb-0" id="summaryName"></p>
                                            </div>
                                            <div class="col-md-6">
                                                <small class="text-muted">Email</small>
                                                <p class="mb-0" id="summaryEmail"></p>
                                            </div>
                                            <div class="col-md-6">
                                                <small class="text-muted">School</small>
                                                <p class="mb-0" id="summarySchool"></p>
                                            </div>
                                            <div class="col-md-6">
                                                <small class="text-muted">Students</small>
                                                <p class="mb-0" id="summaryStudents"></p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-check mb-4">
                                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                        <label class="form-check-label" for="termsCheck">
                                            I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>
                                        </label>
                                    </div>
                                    
                                    <div class="d-flex justify-content-between">
                                        <button type="button" class="btn btn-outline-secondary" onclick="previousStep(2)">
                                            <i class="fas fa-arrow-left me-2"></i> Previous
                                        </button>
                                        <button type="submit" class="btn btn-primary btn-lg px-5">
                                            <i class="fas fa-check me-2"></i> Complete Registration
                                        </button>
                                    </div>
                                </div>
                            </form>
                            
                            <div class="text-center mt-4">
                                <p class="text-muted">Already have an account? <a href="login.html" class="text-primary fw-semibold">Sign In</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
        let currentStep = 1;
        
        function nextStep(step) {
            // Validate current step
            const currentStepElement = document.getElementById(`step${currentStep}`);
            const inputs = currentStepElement.querySelectorAll('input, select');
            let valid = true;
            
            inputs.forEach(input => {
                if (!input.checkValidity()) {
                    valid = false;
                    input.classList.add('is-invalid');
                } else {
                    input.classList.remove('is-invalid');
                }
            });
            
            if (!valid) return;
            
            // Update summary if moving to step 3
            if (step === 3) {
                document.getElementById('summaryName').textContent = 
                    `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`;
                document.getElementById('summaryEmail').textContent = 
                    document.getElementById('email').value;
                document.getElementById('summarySchool').textContent = 
                    document.getElementById('schoolName').value;
                document.getElementById('summaryStudents').textContent = 
                    document.getElementById('studentCount').value;
            }
            
            showStep(step);
        }
        
        function previousStep(step) {
            showStep(step);
        }
        
        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.step').forEach(s => {
                s.classList.remove('active');
                s.classList.remove('completed');
            });
            
            // Show current step
            document.getElementById(`step${step}`).classList.add('active');
            document.getElementById(`step${step}-indicator`).classList.add('active');
            
            // Mark previous steps as completed
            for (let i = 1; i < step; i++) {
                document.getElementById(`step${i}-indicator`).classList.add('completed');
            }
            
            currentStep = step;
        }
        
        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (this.checkValidity()) {
                alert('Registration successful! Welcome to SchoolHub!');
                window.location.href = 'login.html';
            }
            
            this.classList.add('was-validated');
        });
        
        // Password confirmation validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            if (this.value !== password) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
